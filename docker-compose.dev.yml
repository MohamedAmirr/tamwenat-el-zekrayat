name: tamwenat-el-zekrayat-dev

# Standalone Frappe bench dev environment, separate from the production-style
# docker-compose.yml (prebuilt images, no custom apps). Used to develop custom
# apps (talabat_integration, marketplace_integrations) with bench directly.
#
# IMPORTANT: always invoke with an explicit -p to avoid picking up
# COMPOSE_PROJECT_NAME from .env (which belongs to the prod stack):
#
#   docker compose -p tamwenat-el-zekrayat-dev -f docker-compose.dev.yml up -d
#
# See docs/dev-environment.md for the full workflow.

services:
  mariadb:
    image: mariadb:11.8
    platform: linux/arm64
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: "123"
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - dev-mariadb-data:/var/lib/mysql

  redis-cache:
    image: redis:alpine
    platform: linux/arm64

  redis-queue:
    image: redis:alpine
    platform: linux/arm64

  frappe:
    image: frappe/bench:latest
    platform: linux/arm64
    command: sleep infinity
    environment:
      - SHELL=/bin/bash
      - FRAPPE_BIND_ADDR=0.0.0.0
    working_dir: /home/frappe/bench-workspace
    volumes:
      # Named volume is mounted at the *parent* dir, not frappe-bench itself —
      # `bench init` refuses to target a path that already exists (even empty),
      # which a volume mounted directly at frappe-bench would trigger.
      # Whole bench (frappe/erpnext core, venv, node_modules) lives in here —
      # not bind-mounted, not committed to this repo.
      - dev-bench-data:/home/frappe/bench-workspace
      # Only our own apps' source is bind-mounted host<->container, so
      # edits made on the host show up in the container immediately.
      - ./apps/marketplace_integrations:/home/frappe/bench-workspace/frappe-bench/apps/marketplace_integrations
    ports:
      - "127.0.0.1:8000-8005:8000-8005"
      - "127.0.0.1:9000-9005:9000-9005"
    depends_on:
      - mariadb
      - redis-cache
      - redis-queue

volumes:
  dev-mariadb-data:
  dev-bench-data:
